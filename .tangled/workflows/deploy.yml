when:
  - event: ['push']
    branch: ['svelte']

dependencies:
  nixpkgs:
    - bun
    - curl

steps:
  - name: build website
    command: |
      export PUBLIC_BASE_URL="http://localhost:4173"
      bun install && bun run -b build
  - name: trigger deploy
    command: curl -u "$WEBHOOK_AUTH" https://webhook.gaze.systems/deploy-wolumonde
