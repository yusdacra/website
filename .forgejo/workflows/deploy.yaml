name: deploy to server

on:
  push:
    tags:
      - 'latest'

jobs:
  tag:
    runs-on: yusdacra/lixpine:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: https://github.com/cachix/cachix-action@v16
        with:
          name: gazesys-infra
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
      - run: nix run .#nh -- os build -H wolumonde .
